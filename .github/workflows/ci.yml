name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# The shared pmin CI: gofmt, vet, tests with the race detector, staticcheck
# and the layering check. See CurtisD4q/pmin/.github/workflows/go.yml. The
# live tests skip any program (nmap, dig, whois, traceroute) not installed.
jobs:
  go:
    uses: CurtisD4q/pmin/.github/workflows/go.yml@main
    secrets: inherit
    with:
      go: '["stable", "go.mod"]'
      extra: go build -o cairn ./cmd/cairn

  emacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Leave no login behind: git must use MINT_READ_TOKEN for the
          # other Mint repositories, not this job's token, which reads only this one.
          persist-credentials: false
      - run: sudo apt-get update && sudo apt-get install -y emacs-nox
      - run: emacs --batch -Q -L emacs --eval '(setq byte-compile-error-on-warn t)' -f batch-byte-compile emacs/cairn.el
      - run: emacs --batch -Q -L emacs -l emacs/cairn-tests.el -f ert-run-tests-batch-and-exit
